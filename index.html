function payEd(id,k){const b=S.bills.find(x=>x.id===id),r=rec(b,k);
 sheet(`<h2>${esc(b.name)} · ${MN[+k.slice(5)-1]}</h2>${b.det?`<p class=mut>📝 ${esc(b.det)}</p>`:''}
 <label>Amount (RM)<input id=a type=number step=0.01 inputmode=decimal value="${r.amt??''}" placeholder="${amtOf(b,k)||''}"></label>
 <label>Paid via / platform${platSel('v',r.via??b.via??'')}</label>
 <label>Paid on<input id=dt type=date value="${r.date||''}"></label>
 <label>Remark<textarea id=n rows=2>${esc(r.note||'')}</textarea></label>
 <label class=chk><input id=p type=checkbox ${status(b,k)=='paid'?'checked':''}> Paid${b.auto?' (auto-pay bills count as paid after the due date)':''}</label>
 <div class=btns><button onclick="closeSheet()">Cancel</button><button onclick="editBill('${b.id}')">Edit bill</button><button class=pri onclick="savePay('${id}','${k}')">Save</button></div>`)}
function savePay(id,k){const b=S.bills.find(x=>x.id===id);let paid=$('#p').checked;if(b.auto&&paid===duePast(b,k))paid=undefined;let dt=g('dt');if(paid&&!dt)dt=today();
 S.pay[id+'|'+k]={amt:g('a')===''?null:+g('a'),via:g('v'),date:dt,note:g('n'),paid};save();closeSheet();render()}
function editBill(id,gq){const b=S.bills.find(x=>x.id===id)||{type:'fixed',grp:gq||'util',amt:'',due:'',via:'',det:'',end:'',card:'',chg:'',from:ym()};
 sheet(`<h2>${id?'Edit':'New'} bill</h2><label>Name<input id=bn value="${esc(b.name||'')}"></label>
 <label>Type<select id=bt><option value=fixed ${b.type=='fixed'?'selected':''}>Fixed amount</option><option value=var ${b.type!='fixed'?'selected':''}>Varies monthly</option></select></label>
 <label>Group<select id=bg>${Object.entries(GRP).map(e=>`<option value=${e[0]} ${grpOf(b)==e[0]?'selected':''}>${e[1]}</option>`).join('')}</select></label>
 <label class=chk><input id=bh type=checkbox ${b.adhoc?'checked':''}> Ad-hoc (only some months)</label>
 <label class=chk><input id=bauto type=checkbox ${b.auto?'checked':''}> Auto-pay (GIRO / auto-debit) - counts as paid on the due date</label>
 <label>Usual amount (RM)<input id=ba type=number step=0.01 inputmode=decimal value="${b.amt}"></label>
 <label>Due day of month<input id=bd type=number min=1 max=31 value="${b.due}"></label>
 <label>Default pay via / auto-debit from${platSel('bv',b.via)}</label>
 <label>Details (account no., location…)<textarea id=bx rows=2>${esc(b.det)}</textarea></label>
 <label>Starts from<input id=bf type=month value="${b.from||''}"></label>
 <label>Ends after (optional)<input id=be type=month value="${b.end||''}"></label>
 <label>Charged to card (adds to that card's spend on the due date)<select id=bch><option value="">None</option>${S.cards.filter(c=>cardOn(c,ymNow())||c.id==b.chg).map(c=>`<option value=${c.id} ${b.chg==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
 <label>Card being paid (card payment bills only: amount follows its statement)<select id=bc><option value="">None</option>${S.cards.map(c=>`<option value=${c.id} ${b.card==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
 <div class=two><label>⏸ Pause from<input id=bpa type=month value="${b.pa||''}"></label><label>Pause until (last paused month)<input id=bpb type=month value="${b.pb||''}"></label></div><small class=mut>A paused bill is hidden for that period and shows again afterwards.</small>
 <div class=btns>${id?`<button class=bad onclick="delBill('${id}')">Delete</button>`:''}<button onclick="closeSheet()">Cancel</button><button class=pri onclick="saveBill('${id||''}')">Save</button></div>`)}
function saveBill(id){const o={name:g('bn')||'Bill',grp:g('bg'),adhoc:$('#bh').checked,auto:$('#bauto').checked,type:g('bt'),amt:+g('ba')||0,due:+g('bd')||'',via:g('bv'),det:g('bx'),from:g('bf'),end:g('be'),card:g('bg')=='card'?g('bc'):'',chg:g('bch'),pa:g('bpa'),pb:g('bpb')};
 if(id)Object.assign(S.bills.find(x=>x.id===id),o);else S.bills.push({id:uid(),...o});save();closeSheet();render()}
function delBill(id){if(confirm('Delete this bill and its payment history?')){S.bills=S.bills.filter(x=>x.id!==id);save();closeSheet();render()}}

/* ---------- card spend ---------- */
const cname=id=>(S.cards.find(c=>c.id===id)||{name:'?'}).name;
function billSp(){const out=[],y1=V.y+1;S.bills.forEach(b=>{if(!b.chg)return;for(let y=+((b.from||'2026').slice(0,4));y<=y1;y++)for(let m=0;m<12;m++){const k=ym(y,m);if(!active(b,k))continue;const a=amtOf(b,k);if(!(a>0))continue;
  const d=Math.min(+b.due||1,new Date(y,m+1,0).getDate()),id='bill:'+b.id+'|'+k;out.push({id,vb:b.id,vk:k,date:k+'-'+pad(d),card:b.chg,cat:'Bills',amt:a,where:b.name,chk:!!S.vck[id]})}});return out}
const allSp=()=>_c||(_c=S.sp.concat(billSp()));
function calc(c,l){let sp=0;const by={},rbc={},R=c.rules||[];
 l.forEach(x=>{sp+=x.amt;by[x.cat]=(by[x.cat]||0)+x.amt;const r=R.find(r=>r.cat==x.cat);rbc[x.cat]=(rbc[x.cat]||0)+x.amt*(r?+r.rate||0:+c.base||0)/100});
 let rb=0,capped=false;const det=[];for(const k in rbc){const r=R.find(r=>r.cat==k),cap=r&&+r.cap?+r.cap:0,v=cap?Math.min(rbc[k],cap):rbc[k];rb+=v;det.push({cat:k,sp:by[k],rate:r?+r.rate||0:+c.base||0,rb:v,capped:cap&&rbc[k]>cap})}
 if(+c.cap&&rb>+c.cap){rb=+c.cap;capped=true}return{sp,rb,by,det,capped}}
const cardStats=(c,k)=>calc(c,allSp().filter(x=>x.card===c.id&&x.date.startsWith(k)));
const sumA=l=>l.reduce((s,x)=>s+x.amt,0);
const ckList=(cid,k)=>{const p=(S.per||{})[cid+'|'+k]||{};return allSp().filter(x=>x.card==cid&&(p.a&&p.b?x.date>=p.a&&x.date<=p.b:x.date.startsWith(k))).sort((a,b)=>a.date.localeCompare(b.date))};
const spRow=x=>`<div class=row onclick="${x.vb?`payEd('${x.vb}','${x.vk}')`:`editSp('${x.id}')`}" style="border-left-color:var(--pri)"><input type=checkbox class=tk ${x.chk?'checked':''} onclick="event.stopPropagation()" onchange="tick('${x.id}',this.checked)"><div class=mid><b>${x.vb?'🔁 ':''}${esc(x.where||x.cat)}</b><small>${esc(cname(x.card))} · ${esc(x.cat)}</small></div><div class=rt><b>${rm(x.amt)}</b></div></div>`;
function tick(id,v,cid,k){if(id.startsWith('bill:'))S.vck[id]=v;else S.sp.find(s=>s.id===id).chk=v;save();if(cid)ckSum(cid,k);else if(!$('#sh'))render()}
function spendView(){const k=ym(),cs=S.cards.filter(c=>cardOn(c,k)||allSp().some(x=>x.card===c.id&&x.date.startsWith(k)));
 const L=allSp().filter(x=>x.date.startsWith(k)&&(V.sc=='all'||x.card==V.sc)),tot=sumA(L);
 let h=nav(0)+`<div class=chips><button class="${V.sc=='all'?'on':''}" onclick="V.sc='all';render()">All cards</button>`+cs.map(c=>`<button class="${V.sc==c.id?'on':''}" onclick="V.sc='${c.id}';render()">${esc(c.name)}</button>`).join('')+'</div>'
 +`<div class=chips><button class="${V.sv!='list'?'on':''}" onclick="V.sv='cal';render()">📅 Calendar</button><button class="${V.sv=='list'?'on':''}" onclick="V.sv='list';render()">☰ List</button><button class=sm style="margin-left:auto" onclick="sortEd()">⇅ Order cards</button></div>`;
 if(V.sv=='list'){const ds=[...new Set(L.map(x=>x.date))].sort().reverse();
  h+=ds.length?ds.map(d=>{const l=L.filter(x=>x.date==d);return`<h3><span>${+d.slice(8)} ${MN[V.m]}</span><span>${rm(sumA(l))}</span></h3>`+l.map(spRow).join('')}).join(''):'<p class=mut style="text-align:center">No spending recorded this month</p>'}
 else{const first=(new Date(V.y,V.m,1).getDay()+6)%7,n=new Date(V.y,V.m+1,0).getDate(),dt={},ct={};
  L.forEach(x=>{const d=+x.date.slice(8);dt[d]=(dt[d]||0)+x.amt;ct[d]=(ct[d]||0)+1});
  h+='<div class=cal>'+'MTWTFSS'.split('').map(d=>`<b class=wk>${d}</b>`).join('')+'<i></i>'.repeat(first);
  for(let d=1;d<=n;d++)h+=`<button class="day ${dt[d]?'has':''} ${ym()+'-'+pad(d)==today()?'tdy':''}" onclick="dayEd(${d})"><span>${d}</span>${dt[d]?`<small>${Math.round(dt[d])}</small>`:''}</button>`;
  h+='</div><p class=mut style="text-align:center">Tap a date to see its transactions</p>'}
 return h+`<h3><span>Month total</span><span>${rm(tot)}</span></h3>`+cs.map(c=>{const t=cardStats(c,k),st=S.stmt[c.id+'|'+k],bud=+c.budget||0,p=S.per[c.id+'|'+k]||{},cl=ckList(c.id,k),ck=cl.filter(x=>x.chk),tt=sumA(ck),df=st!=null&&st!==''?st-tt:null,hasR=(c.rules||[]).some(r=>+r.rate)||+c.base;
  return`<div class=card><div class=hd><b>${esc(c.name)}</b><span>${rm(t.sp)}${bud?' / '+bud:''}</span></div>${bud?`<div class=bar><i style="width:${Math.min(100,t.sp/bud*100)}%" class="${t.sp>bud?'over':''}"></i></div>`:''}
  ${hasR?'':`<small>${Object.entries(t.by).map(([a,v])=>a+' '+v.toFixed(0)).join(' · ')||'No spend yet'}</small>`}
  <div class=rb>${hasR?(t.det.map(d=>`<div class=rbr><span>${esc(d.cat)} · RM ${d.sp.toFixed(0)} × ${d.rate}%</span><span>${rm(d.rb)}${d.capped?' (cap)':''}</span></div>`).join('')||'<small>No spend yet</small>')+`<div class="rbr tot"><span>Total rebate${t.capped?' (card cap '+c.cap+')':''}</span><b class=ok>${rm(t.rb)}</b></div>`:'<span class=mut>No rebate on this card</span>'}</div>
  <div class=stm>Statement <input type=number step=0.01 inputmode=decimal value="${st??''}" onchange="setStmt('${c.id}','${k}',this.value)"><button class=sm onclick="checkEd('${c.id}','${k}')">Cross-check ›</button></div>
  <small class=mut>${p.a&&p.b?'Period '+p.a.slice(8)+'/'+p.a.slice(5,7)+' – '+p.b.slice(8)+'/'+p.b.slice(5,7)+' · ':''}Ticked ${ck.length}/${cl.length} · ${rm(tt)} ${df==null?'':Math.abs(df)<0.005?'<b class=ok>✓ matches statement</b>':`<b class=bad>· ${df.toFixed(2)} left to match</b>`}</small></div>`}).join('')+'<button class=fab onclick="editSp()">+</button>'}
function sortEd(){sheet(`<h2>Card order</h2><div id=so></div><div class=btns><button class=pri onclick="closeSheet();render()">Done</button></div>`);soDraw()}
function soDraw(){const k=ym();$('#so').innerHTML=S.cards.map((c,i)=>({c,i})).filter(o=>cardOn(o.c,k)).map(o=>`<div class=row style="border-left-color:var(--pri)"><div class=mid><b>${esc(o.c.name)}</b></div><button onclick="mvCard(${o.i},-1)">▲</button><button onclick="mvCard(${o.i},1)">▼</button></div>`).join('')}
function mvCard(i,d){const k=ym();let j=i+d;while(S.cards[j]&&!cardOn(S.cards[j],k))j+=d;if(!S.cards[j])return;[S.cards[i],S.cards[j]]=[S.cards[j],S.cards[i]];save();soDraw()}
function dayEd(d){const dt=ym()+'-'+pad(d),l=allSp().filter(x=>x.date==dt);
 sheet(`<h2>${d} ${MN[V.m]} ${V.y}</h2>${l.length?l.map(spRow).join('')+`<p style="text-align:right"><b>Day total ${rm(sumA(l))}</b></p>`:'<p class=mut>No spending on this day</p>'}<div class=btns><button onclick="closeSheet();render()">Close</button><button class=pri onclick="editSp(null,'${dt}')">+ Add spend</button></div>`)}
function checkEd(cid,k){const c=S.cards.find(x=>x.id===cid),p=S.per[cid+'|'+k]||{},st=S.stmt[cid+'|'+k];
 sheet(`<h2>${esc(c.name)} · ${MN[+k.slice(5)-1]} statement</h2>
 <div class=two><label>Period from<input id=pa type=date value="${p.a||''}" onchange="setPer('${cid}','${k}')"></label><label>Period to<input id=pb type=date value="${p.b||''}" onchange="setPer('${cid}','${k}')"></label></div>
 <label>Statement amount (RM)<input id=ps type=number step=0.01 inputmode=decimal value="${st??''}" onchange="setStmt('${cid}','${k}',this.value,1)"></label>
 <div id=ckSum class=card style="margin-top:10px"></div><div id=ckL></div>
 <div class=btns><button class=pri onclick="closeSheet();render()">Done</button></div>`);ckDraw(cid,k)}
function ckDraw(cid,k){$('#ckL').innerHTML=ckList(cid,k).map(x=>`<div class=row style="border-left-color:var(--pri)" onclick="this.querySelector('input').click()"><input type=checkbox class=tk ${x.chk?'checked':''} onclick="event.stopPropagation()" onchange="tick('${x.id}',this.checked,'${cid}','${k}')"><div class=d>${x.date.slice(8)}/${x.date.slice(5,7)}</div><div class=mid><b>${x.vb?'🔁 ':''}${esc(x.where||x.cat)}</b><small>${esc(x.cat)}</small></div><div class=rt><b>${rm(x.amt)}</b></div></div>`).join('')||'<p class=mut>No transactions in this period</p>';ckSum(cid,k)}
function ckSum(cid,k){const c=S.cards.find(x=>x.id===cid),l=ckList(cid,k),t=l.filter(x=>x.chk),T=sumA(l),tt=sumA(t),st=S.stmt[cid+'|'+k],df=st!=null&&st!==''?st-tt:null;
 $('#ckSum').innerHTML=`Recorded <b>${l.length}</b> items · ${rm(T)}<br>Ticked <b>${t.length}</b> · ${rm(tt)}<br>Not ticked <b>${l.length-t.length}</b> · ${rm(T-tt)}<br>${df==null?'<span class=mut>Enter the statement amount to compare</span>':Math.abs(df)<0.005?'<b class=ok>✓ Ticked total matches the statement</b>':`<b class=bad>Statement − ticked = ${df.toFixed(2)}</b>`}<br>Est. rebate for this period <b class=ok>${rm(calc(c,l).rb)}</b>`}
function setPer(cid,k){S.per[cid+'|'+k]={a:g('pa'),b:g('pb')};save();ckDraw(cid,k)}
function setStmt(c,k,v,inSheet){S.stmt[c+'|'+k]=v===''?null:+v;save();inSheet?ckSum(c,k):render()}
function catOpts(cid,cur){const c=S.cards.find(x=>x.id==cid)||{rules:[]},l=[...(c.rules||[]).map(r=>r.cat),'Others'];if(cur&&!l.includes(cur))l.push(cur);return l.map(a=>`<option ${a==cur?'selected':''}>${esc(a)}</option>`).join('')}
function editSp(id,dt){const x=S.sp.find(s=>s.id===id)||{date:dt||(ym()==ym(now.getFullYear(),now.getMonth())?today():ym()+'-01'),card:V.sc!='all'?V.sc:(S.cards.find(c=>cardOn(c,ymNow()))||{}).id,cat:'',amt:'',where:''};
 sheet(`<h2>${id?'Edit':'Add'} spend</h2><label>Date<input id=sd type=date value="${x.date}"></label>
 <label>Card<select id=sc onchange="$('#st').innerHTML=catOpts(this.value,'')">${S.cards.filter(c=>cardOn(c,x.date.slice(0,7))||c.id==x.card).map(c=>`<option value=${c.id} ${c.id==x.card?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
 <label>Category<select id=st>${catOpts(x.card,x.cat)}</select></label>
 <label>Amount (RM)<input id=sa type=number step=0.01 inputmode=decimal value="${x.amt}"></label>
 <label>Where / what<input id=sw value="${esc(x.where)}"></label>
 <label class=chk><input id=sk type=checkbox ${x.chk?'checked':''}> Checked against statement</label>
 <div class=btns>${id?`<button class=bad onclick="delSp('${id}')">Delete</button>`:''}<button onclick="closeSheet()">Cancel</button><button class=pri onclick="saveSp('${id||''}')">Save</button></div>`)}
function saveSp(id){const o={date:g('sd'),card:g('sc'),cat:g('st'),amt:+g('sa')||0,where:g('sw'),chk:$('#sk').checked};if(!o.date||!o.amt)return alert('Date and amount needed');
 if(id)Object.assign(S.sp.find(s=>s.id===id),o);else S.sp.push({id:uid(),...o});save();closeSheet();render()}
function delSp(id){S.sp=S.sp.filter(s=>s.id!==id);save();closeSheet();render()}

/* ---------- cards & backup ---------- */
function setView(){const k=ymNow(),act=S.cards.filter(c=>cardOn(c,k)),rem=S.cards.filter(c=>!cardOn(c,k));
 const rules=c=>{const R=(c.rules||[]).filter(r=>+r.rate||+r.cap).map(r=>r.cat+' '+r.rate+'%'+(+r.cap?' (cap '+r.cap+')':'')),o=+c.base?'others '+c.base+'%':'';const t=[...R,o].filter(Boolean).join(' · ');return(t||'No rebate')+(+c.cap?' · total cap '+c.cap:'')};
 const cr=c=>`<div class=row onclick="editCard('${c.id}')" style="border-left-color:var(--pri)"><div class=mid><b>${esc(c.name)}</b><small>${esc(rules(c))}</small></div><div class=rt>${c.budget?rm(c.budget):''}</div></div>`;
 return'<h2>Cards</h2>'+act.map(cr).join('')+`<button class=add onclick="editCard()">+ Add card</button>`+(rem.length?`<h3><span>Removed cards (records kept)</span></h3>`+rem.map(cr).join(''):'')
 +`<h2>Payment platforms</h2><input value="${esc(S.plat.join(', '))}" onchange="setPlat(this.value)"><p class=mut>These appear in the "Paid via" dropdown.</p>
 <h2>Backup</h2><div class=btns><button onclick="exportJ()">Export backup</button><button onclick="$('#imp').click()">Import</button><button onclick="exportC()">Spend CSV</button></div>
 ${user?`<h2>Account</h2><p class=mut>${esc(user.email)} · <span id=sy>${syncMsg}</span></p><button onclick="logout()">Log out</button>`:''}<input id=imp type=file accept=".json,application/json" hidden onchange="importJ(this)"><p class=mut>Data is stored online in your account (and cached on this device). Export a backup now and then.</p>`}
function setPlat(v){S.plat=[...new Set(v.split(',').map(x=>x.trim()).filter(Boolean))];save();render()}
const ruleRow=r=>`<div class=rl><input placeholder="Category" value="${esc(r.cat)}"><input type=number step=0.01 inputmode=decimal placeholder="%" value="${r.rate}"><input type=number inputmode=decimal placeholder="Cap" value="${r.cap||''}"><button onclick="this.parentNode.remove()">✕</button></div>`;
function editCard(id){const c=S.cards.find(x=>x.id===id)||{name:'',budget:'',cap:'',rules:[],base:0,from:ymNow(),end:''};
 sheet(`<h2>${id?'Edit':'New'} card</h2><label>Name (e.g. UOB 1071)<input id=cn value="${esc(c.name)}"></label>
 <label>Monthly spend budget (RM, optional)<input id=cb type=number inputmode=decimal value="${c.budget||''}"></label>
 <div class=two><label>Active from<input id=cf type=month value="${c.from||''}"></label><label>Last active month<input id=ce type=month value="${c.end||''}"></label></div>
 <small class=mut>Leave "last active month" empty while you still use the card. After that month it stops showing, but all its records are kept.</small>
 <h3><span>Rebate rules</span></h3><small class=mut>Category · rebate % · monthly cap in RM (empty = no cap). Leave everything at 0 for a card with no rebate.</small>
 <div id=rules>${(c.rules||[]).map(ruleRow).join('')}</div>
 <button class=add onclick="$('#rules').insertAdjacentHTML('beforeend',ruleRow({cat:'',rate:'',cap:''}))">+ Add category rule</button>
 <label>All other spending · rebate %<input id=cbase type=number step=0.01 inputmode=decimal value="${c.base||0}"></label>
 <label>Total monthly rebate cap (RM, empty = no cap)<input id=cp type=number inputmode=decimal value="${c.cap||''}"></label>
 <div class=btns>${id?`<button class=bad onclick="rmCard('${id}')">Remove card</button>`:''}<button onclick="closeSheet()">Cancel</button><button class=pri onclick="saveCard('${id||''}')">Save</button></div>`)}
function saveCard(id){const rules=[...document.querySelectorAll('#rules .rl')].map(d=>{const i=d.querySelectorAll('input');return{cat:i[0].value.trim(),rate:+i[1].value||0,cap:+i[2].value||0}}).filter(r=>r.cat);
 const o={name:g('cn')||'Card',budget:+g('cb')||0,cap:+g('cp')||0,rules,base:+g('cbase')||0,from:g('cf'),end:g('ce')};
 if(id)Object.assign(S.cards.find(x=>x.id===id),o);else S.cards.push({id:uid(),...o});save();closeSheet();render()}
function rmCard(id){const c=S.cards.find(x=>x.id===id),k=ymNow();if(!confirm('Remove '+c.name+' from next month? All past records are kept.'))return;
 c.end=k;S.bills.forEach(b=>{if(b.card==id&&(!b.end||b.end>k))b.end=k});save();closeSheet();render()}
async function dl(n,t,m){const f=new File([t],n,{type:m});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name=='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;a.click()}
const exportJ=()=>dl(`mymoney-${today()}.json`,JSON.stringify(S),'application/json');
const exportC=()=>dl(`spend-${today()}.csv`,'Date,Card,Category,Amount,Where\n'+allSp().slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,cname(x.card),x.cat,x.amt,'"'+(x.where||'').replace(/"/g,'""')+'"'].join(',')).join('\n'),'text/csv');
function importJ(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.bills||!d.cards)throw 0;if(confirm('Replace all current data with this backup?')){S=d;save();render()}}catch(e){alert('Not a valid backup file')}};r.readAsText(f)}

/* ---------- shell ---------- */
function sheet(h){closeSheet();const d=document.createElement('div');d.id='sh';d.innerHTML=`<div class=bk onclick="closeSheet();render()"></div><div class=pn>${h}</div>`;document.body.appendChild(d)}
function closeSheet(){const s=$('#sh');if(s)s.remove()}
