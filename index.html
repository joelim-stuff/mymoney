<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>My Money</title>
<style>
:root{--bg:#f4f6f8;--cd:#fff;--tx:#111827;--mut:#6b7280;--pri:#0f766e;--ok:#16a34a;--wn:#d97706;--bad:#dc2626;--bd:#e5e7eb;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b1115;--cd:#161e24;--tx:#e5e7eb;--mut:#94a3b8;--pri:#2dd4bf;--bd:#26323a;--ok:#4ade80;--wn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 12px calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto}
h2{font-size:17px;margin:18px 0 8px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:16px 0 6px}
small,.mut{color:var(--mut);font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}
button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 14px}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 0}label input,label select,label textarea{margin-top:4px}
label.chk{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--tx)}label.chk input{width:auto;margin:0}
.nav{display:flex;align-items:center;gap:8px;padding:12px 0}.nav b{flex:1;text-align:center;font-size:18px}.sm{padding:6px 10px;font-size:13px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum div{background:var(--cd);border-radius:12px;padding:10px;border:1px solid var(--bd)}.sum small{display:block}.sum b{font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--wn);border-radius:12px;padding:10px;margin-bottom:6px}
.row.paid{border-left-color:var(--ok)}.row.late{border-left-color:var(--bad)}
.d{min-width:28px;text-align:center;font-weight:700;color:var(--mut)}.mid{flex:1;min-width:0}.mid b,.mid small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{text-align:right}.rt b{display:block}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;color:#fff;background:var(--wn)}.pill.paid{background:var(--ok)}.pill.late{background:var(--bad)}
.ck{padding:6px 10px;border-radius:99px}
.add{width:100%;margin:8px 0;border-style:dashed;color:var(--pri)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;margin-bottom:6px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 6px}.bar i{display:block;height:100%;background:var(--pri)}.bar i.over{background:var(--bad)}
.rb{margin:6px 0}.stm{display:flex;align-items:center;gap:8px;font-size:13px}.stm input{width:110px;padding:6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.chips button{white-space:nowrap;padding:6px 12px;border-radius:99px}.chips .on{background:var(--pri);color:#fff}
.scroll{overflow-x:auto}.yr{border-collapse:collapse;font-size:12px;width:100%}.yr td,.yr th{padding:7px 4px;text-align:center;border-bottom:1px solid var(--bd)}.yr .nm{text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--bg)}.yr .t{color:var(--mut)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--wn)}.dot.paid{background:var(--ok)}.dot.late{background:var(--bad)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;font-size:28px;border:0;box-shadow:0 4px 12px #0004}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 0;color:var(--mut)}nav .on{color:var(--pri);font-weight:700}
#sh{position:fixed;inset:0;z-index:9}.bk{position:absolute;inset:0;background:#0007}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.pn h2{margin-top:0}.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1}
</style></head><body>
<div id="app"></div>
<nav>
<button data-t="bills" onclick="V.tab='bills';render()">📋 Bills</button>
<button data-t="spend" onclick="V.tab='spend';render()">💳 Card Spend</button>
<button data-t="set" onclick="V.tab='set';render()">⚙️ Cards &amp; Backup</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://xvwykmpsbfzbphpadglv.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2d3lrbXBzYmZ6YnBocGFkZ2x2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5Njk4NTYsImV4cCI6MjEwODU0NTg1Nn0.9ENh1iIc4BjbqK4PHJsOj4pkYRQRho8kcB353sitv5U";
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),g=i=>$('#'+i).value;
const MN='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rm=n=>'RM '+(+n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const now=new Date(),KEY='mymoney_v1';
const today=()=>`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
let V={tab:'bills',yr:false,y:now.getFullYear(),m:now.getMonth(),sc:'all'},S;
const ym=(y=V.y,m=V.m)=>y+'-'+pad(m+1);

function seed(){
 const f=ym(now.getFullYear(),now.getMonth()),B=(name,type,amt,due,via,o={})=>({id:uid(),name,type,amt,due,via,det:'',end:'',card:'',from:f,...o});
 return{cats:['Petrol','Dining','Grocery','Others'],
 cards:[{id:'uob',name:'UOB 1071',budget:1500,cap:0,rates:{Petrol:10,Dining:10,Grocery:10,Others:0.2}},
  {id:'ocbc',name:'OCBC',budget:500,cap:0,rates:{}},{id:'mbb',name:'MBB',budget:0,cap:0,rates:{Petrol:1,Dining:1,Grocery:1,Others:1}},{id:'hl',name:'HL',budget:0,cap:0,rates:{}}],
 bills:[B('Housing loan','fixed',2681,4,'MBB',{det:'1798 1007 455'}),B('Perai Utama rental','fixed',360,1,'',{end:'2028-04'}),
  B('My Insurance 1','fixed',258.33,23,'GIRO via OCBC Master'),B('My Insurance 2','fixed',333.33,18,'GIRO via OCBC Master'),
  B('SG Insurance','var',237,28,'GIRO via UOB Visa'),B('Car','fixed',250,3,'MBB'),B('HPC Maint','fixed',283.4,14,'MBB'),
  B('TNB','var',0,1,'OCBC 360'),B('Astro','fixed',30.24,6,'UOB Visa'),B('Air Selangor','var',0,10,'TNG'),
  B('Digi','var',0,15,'OCBC 360'),B('TIME','fixed',104.95,22,'OCBC 360'),B('Indah Water','var',0,20,'OCBC 360'),
  B('UOB card','var',0,28,'MBB',{card:'uob'}),B('OCBC card','var',0,15,'OCBC 360',{card:'ocbc'}),B('MBB card','var',0,14,'MBB',{card:'mbb'}),B('HL card','var',0,1,'MBB',{card:'hl'})],
 pay:{},sp:[],stmt:{}}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
let sb=null,user=null,tmr,dirty=false,syncMsg='';
const setSync=m=>{syncMsg=m;const e=$('#sy');if(e)e.textContent=m};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()};
function push(){if(!user)return;dirty=true;clearTimeout(tmr);setSync('Saving…');
 tmr=setTimeout(async()=>{const{error}=await sb.from('app_data').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});if(!error)dirty=false;setSync(error?'⚠ Not synced yet (will retry on next change)':'✓ Synced')},500)}
async function pull(){if(!user||dirty)return;const{data,error}=await sb.from('app_data').select('data').maybeSingle();
 if(error){setSync('⚠ Offline - showing saved copy');return}
 if(data){S=data.data;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}setSync('✓ Synced')}else{S=S||seed();push()}render()}
function loginView(){return`<h2 style="margin-top:60px;text-align:center">My Money</h2><label>Email<input id=em type=email autocomplete=username></label><label>Password<input id=pw type=password autocomplete=current-password></label><div class=btns><button class=pri onclick="auth('in')">Log in</button><button onclick="auth('up')">Sign up</button></div><p id=am class=mut></p>`}
async function auth(t){const c={email:g('em'),password:g('pw')},r=t=='in'?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);
 if(r.error){$('#am').textContent=r.error.message;return}if(!r.data.session){$('#am').textContent='Check your email to confirm, then log in.';return}user=r.data.user;await pull();render()}
async function logout(){await sb.auth.signOut();user=null;render()}

/* ---------- bills ---------- */
const rec=(b,k)=>S.pay[b.id+'|'+k]||{};
const active=(b,k)=>k>=(b.from||'0')&&(!b.end||k<=b.end);
function amtOf(b,k){const r=rec(b,k);if(r.amt!=null&&r.amt!=='')return+r.amt;
 if(b.card){const s=S.stmt[b.card+'|'+k];if(s!=null&&s!=='')return+s}return b.type==='fixed'?+b.amt||0:0}
function status(b,k){if(rec(b,k).paid)return'paid';const[y,m]=k.split('-');return new Date()>new Date(y,m-1,b.due||1,23,59)?'late':'due'}
const nav=yr=>`<div class=nav><button onclick="navM(-1)">‹</button><b>${V.yr&&V.tab=='bills'?V.y:MN[V.m]+' '+V.y}</b><button onclick="navM(1)">›</button>${yr?`<button class=sm onclick="V.yr=!V.yr;render()">${V.yr?'Month':'Year'}</button>`:''}</div>`;
function navM(d){if(V.yr&&V.tab=='bills')V.y+=d;else{V.m+=d;if(V.m<0){V.m=11;V.y--}if(V.m>11){V.m=0;V.y++}}render()}
function row(b,k){const r=rec(b,k),a=amtOf(b,k),s=status(b,k);
 return`<div class="row ${s}" onclick="payEd('${b.id}','${k}')"><div class=d>${b.due||'-'}</div><div class=mid><b>${esc(b.name)}</b><small>${esc(r.via||b.via||'')}${r.paid&&r.date?' · paid '+r.date.slice(8)+'/'+r.date.slice(5,7):''}${r.note?' · '+esc(r.note):''}</small></div><div class=rt><b>${a?rm(a):'—'}</b><span class="pill ${s}">${s=='paid'?'Paid':s=='late'?'Overdue':'Not yet'}</span></div><button class=ck onclick="event.stopPropagation();quick('${b.id}','${k}')">${s=='paid'?'↺':'✓'}</button></div>`}
function billsView(){const k=ym(),L=S.bills.filter(b=>active(b,k));let t=0,p=0;
 L.forEach(b=>{const a=amtOf(b,k);t+=a;if(rec(b,k).paid)p+=a});
 const grp=(n,fn)=>{const l=L.filter(fn);return l.length?`<h3>${n}</h3>`+l.map(b=>row(b,k)).join(''):''};
 return nav(1)+`<div class=sum><div><small>Total</small><b>${rm(t)}</b></div><div><small>Paid</small><b class=ok>${rm(p)}</b></div><div><small>Left</small><b class=bad>${rm(t-p)}</b></div></div>`
 +grp('Fixed installments',b=>!b.card&&b.type=='fixed')+grp('Utilities &amp; variable',b=>!b.card&&b.type!='fixed')+grp('Card payments',b=>!!b.card)+`<button class=add onclick="editBill()">+ Add bill</button>`}
function yearView(){let h=nav(1)+'<div class=scroll><table class=yr><tr><th></th>'+MN.map(m=>`<th>${m}</th>`).join('')+'</tr>';
 S.bills.forEach(b=>{h+=`<tr><td class=nm>${esc(b.name)}</td>`+MN.map((_,i)=>{const k=ym(V.y,i);return active(b,k)?`<td onclick="V.m=${i};V.yr=false;render()"><i class="dot ${status(b,k)}"></i></td>`:'<td></td>'}).join('')+'</tr>'});
 return h+'<tr><td class=nm><b>Total</b></td>'+MN.map((_,i)=>{const k=ym(V.y,i);return`<td class=t>${Math.round(S.bills.filter(b=>active(b,k)).reduce((s,b)=>s+amtOf(b,k),0))}</td>`}).join('')+'</tr></table></div><p class=mut>🟢 paid · 🟠 not yet · 🔴 overdue. Tap a dot to open that month.</p>'}
function quick(id,k){const r=S.pay[id+'|'+k]=S.pay[id+'|'+k]||{};r.paid=!r.paid;if(r.paid)r.date=r.date||today();else delete r.date;save();render()}
function payEd(id,k){const b=S.bills.find(x=>x.id===id),r=rec(b,k);
 sheet(`<h2>${esc(b.name)} · ${MN[+k.slice(5)-1]}</h2>${b.det?`<p class=mut>📝 ${esc(b.det)}</p>`:''}
 <label>Amount (RM)<input id=a type=number step=0.01 inputmode=decimal value="${r.amt??''}" placeholder="${amtOf(b,k)||''}"></label>
 <label>Paid via / platform<input id=v value="${esc(r.via??b.via??'')}"></label>
 <label>Paid on<input id=dt type=date value="${r.date||''}"></label>
 <label>Remark<textarea id=n rows=2>${esc(r.note||'')}</textarea></label>
 <label class=chk><input id=p type=checkbox ${r.paid?'checked':''}> Paid</label>
 <div class=btns><button onclick="closeSheet()">Cancel</button><button onclick="editBill('${b.id}')">Edit bill</button><button class=pri onclick="savePay('${id}','${k}')">Save</button></div>`)}
function savePay(id,k){const paid=$('#p').checked;let dt=g('dt');if(paid&&!dt)dt=today();
 S.pay[id+'|'+k]={amt:g('a')===''?null:+g('a'),via:g('v'),date:dt,note:g('n'),paid};save();closeSheet();render()}
function editBill(id){const b=S.bills.find(x=>x.id===id)||{type:'fixed',amt:'',due:'',via:'',det:'',end:'',card:'',from:ym()};
 sheet(`<h2>${id?'Edit':'New'} bill</h2><label>Name<input id=bn value="${esc(b.name||'')}"></label>
 <label>Type<select id=bt><option value=fixed ${b.type=='fixed'?'selected':''}>Fixed amount</option><option value=var ${b.type!='fixed'?'selected':''}>Varies monthly</option></select></label>
 <label>Usual amount (RM)<input id=ba type=number step=0.01 inputmode=decimal value="${b.amt}"></label>
 <label>Due day of month<input id=bd type=number min=1 max=31 value="${b.due}"></label>
 <label>Pay via (platform)<input id=bv value="${esc(b.via)}"></label>
 <label>Details (account no., location…)<textarea id=bx rows=2>${esc(b.det)}</textarea></label>
 <label>Starts from<input id=bf type=month value="${b.from||''}"></label>
 <label>Ends after (optional)<input id=be type=month value="${b.end||''}"></label>
 <label>Linked card (amount follows statement)<select id=bc><option value="">None</option>${S.cards.map(c=>`<option value=${c.id} ${b.card==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
 <div class=btns>${id?`<button class=bad onclick="delBill('${id}')">Delete</button>`:''}<button onclick="closeSheet()">Cancel</button><button class=pri onclick="saveBill('${id||''}')">Save</button></div>`)}
function saveBill(id){const o={name:g('bn')||'Bill',type:g('bt'),amt:+g('ba')||0,due:+g('bd')||'',via:g('bv'),det:g('bx'),from:g('bf'),end:g('be'),card:g('bc')};
 if(id)Object.assign(S.bills.find(x=>x.id===id),o);else S.bills.push({id:uid(),...o});save();closeSheet();render()}
function delBill(id){if(confirm('Delete this bill and its payment history?')){S.bills=S.bills.filter(x=>x.id!==id);save();closeSheet();render()}}

/* ---------- card spend ---------- */
const cname=id=>(S.cards.find(c=>c.id===id)||{name:'?'}).name;
function cardStats(c,k){let sp=0,rb=0;const by={};
 S.sp.filter(x=>x.card===c.id&&x.date.startsWith(k)).forEach(x=>{sp+=x.amt;rb+=(+c.rates[x.cat]||0)*x.amt/100;by[x.cat]=(by[x.cat]||0)+x.amt});
 if(+c.cap)rb=Math.min(rb,+c.cap);return{sp,rb,by}}
function spendView(){const k=ym(),cs=S.cards.filter(c=>!c.off||S.sp.some(x=>x.card===c.id&&x.date.startsWith(k)));
 let h=nav(0)+cs.map(c=>{const t=cardStats(c,k),st=S.stmt[c.id+'|'+k],bud=+c.budget||0,df=st!=null&&st!==''?st-t.sp:null;
  return`<div class=card><div class=hd><b>${esc(c.name)}</b><span>${rm(t.sp)}${bud?' / '+bud:''}</span></div>${bud?`<div class=bar><i style="width:${Math.min(100,t.sp/bud*100)}%" class="${t.sp>bud?'over':''}"></i></div>`:''}
  <small>${Object.entries(t.by).map(([a,v])=>a+' '+v.toFixed(0)).join(' · ')||'No spend yet'}</small>
  <div class=rb>Rebate <b class=ok>${rm(t.rb)}</b>${+c.cap&&t.rb>=c.cap?' (capped)':''}</div>
  <div class=stm>Statement <input type=number step=0.01 inputmode=decimal value="${st??''}" onchange="setStmt('${c.id}','${k}',this.value)">${df==null?'':Math.abs(df)<0.005?'<span class=ok>✓ matches</span>':`<span class=bad>${df>0?'+':''}${df.toFixed(2)} unrecorded</span>`}</div></div>`}).join('');
 h+=`<div class=chips><button class="${V.sc=='all'?'on':''}" onclick="V.sc='all';render()">All</button>`+cs.map(c=>`<button class="${V.sc==c.id?'on':''}" onclick="V.sc='${c.id}';render()">${esc(c.name)}</button>`).join('')+'</div>';
 const L=S.sp.filter(x=>x.date.startsWith(k)&&(V.sc=='all'||x.card==V.sc)).sort((a,b)=>b.date.localeCompare(a.date));
 return h+(L.length?L.map(x=>`<div class=row onclick="editSp('${x.id}')" style="border-left-color:var(--pri)"><div class=d>${x.date.slice(8)}</div><div class=mid><b>${esc(x.where||x.cat)}</b><small>${esc(cname(x.card))} · ${esc(x.cat)}</small></div><div class=rt><b>${rm(x.amt)}</b></div></div>`).join(''):'<p class=mut style="text-align:center">No spending recorded this month</p>')+'<button class=fab onclick="editSp()">+</button>'}
function setStmt(c,k,v){S.stmt[c+'|'+k]=v===''?null:+v;save();render()}
function editSp(id){const x=S.sp.find(s=>s.id===id)||{date:ym()==ym(now.getFullYear(),now.getMonth())?today():ym()+'-01',card:V.sc!='all'?V.sc:(S.cards.find(c=>!c.off)||{}).id,cat:S.cats[0],amt:'',where:''};
 sheet(`<h2>${id?'Edit':'Add'} spend</h2><label>Date<input id=sd type=date value="${x.date}"></label>
 <label>Card<select id=sc>${S.cards.filter(c=>!c.off||c.id==x.card).map(c=>`<option value=${c.id} ${c.id==x.card?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
 <label>Category<select id=st>${S.cats.map(c=>`<option ${c==x.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
 <label>Amount (RM)<input id=sa type=number step=0.01 inputmode=decimal value="${x.amt}"></label>
 <label>Where / what<input id=sw value="${esc(x.where)}"></label>
 <div class=btns>${id?`<button class=bad onclick="delSp('${id}')">Delete</button>`:''}<button onclick="closeSheet()">Cancel</button><button class=pri onclick="saveSp('${id||''}')">Save</button></div>`)}
function saveSp(id){const o={date:g('sd'),card:g('sc'),cat:g('st'),amt:+g('sa')||0,where:g('sw')};if(!o.date||!o.amt)return alert('Date and amount needed');
 if(id)Object.assign(S.sp.find(s=>s.id===id),o);else S.sp.push({id:uid(),...o});save();closeSheet();render()}
function delSp(id){S.sp=S.sp.filter(s=>s.id!==id);save();closeSheet();render()}

/* ---------- cards & backup ---------- */
function setView(){return'<h2>Cards</h2>'+S.cards.map(c=>`<div class=row onclick="editCard('${c.id}')" style="border-left-color:var(--pri)"><div class=mid><b>${esc(c.name)}${c.off?' (archived)':''}</b><small>${S.cats.map(a=>a+' '+(c.rates[a]||0)+'%').join(' · ')}</small></div><div class=rt>${c.budget?rm(c.budget):''}</div></div>`).join('')
 +`<button class=add onclick="editCard()">+ Add card</button><h2>Spend categories</h2><input value="${esc(S.cats.join(', '))}" onchange="setCats(this.value)"><p class=mut>Separate with commas. Then set each card's rebate % for any new category.</p>
 <h2>Backup</h2><div class=btns><button onclick="exportJ()">Export backup</button><button onclick="$('#imp').click()">Import</button><button onclick="exportC()">Spend CSV</button></div>
 ${user?`<h2>Account</h2><p class=mut>${esc(user.email)} · <span id=sy>${syncMsg}</span></p><button onclick="logout()">Log out</button>`:''}<input id=imp type=file accept=".json,application/json" hidden onchange="importJ(this)"><p class=mut>Data is stored on this phone only. Export a backup regularly, especially before clearing browser data.</p>`}
function setCats(v){const a=[...new Set(v.split(',').map(s=>s.trim()).filter(Boolean))];if(a.length){S.cats=a;save()}render()}
function editCard(id){const c=S.cards.find(x=>x.id===id)||{name:'',budget:'',cap:'',rates:{}};
 sheet(`<h2>${id?'Edit':'New'} card</h2><label>Name (e.g. UOB 1071)<input id=cn value="${esc(c.name)}"></label>
 <label>Monthly spend budget (RM)<input id=cb type=number inputmode=decimal value="${c.budget}"></label>
 <label>Monthly rebate cap (RM, 0 = none)<input id=cp type=number inputmode=decimal value="${c.cap}"></label>
 ${S.cats.map((a,i)=>`<label>Rebate % · ${esc(a)}<input id=r${i} type=number step=0.01 inputmode=decimal value="${c.rates[a]??0}"></label>`).join('')}
 <label class=chk><input id=co type=checkbox ${c.off?'checked':''}> Archived (hide from new entries)</label>
 <div class=btns><button onclick="closeSheet()">Cancel</button><button class=pri onclick="saveCard('${id||''}')">Save</button></div>`)}
function saveCard(id){const rates={};S.cats.forEach((a,i)=>rates[a]=+g('r'+i)||0);
 const o={name:g('cn')||'Card',budget:+g('cb')||0,cap:+g('cp')||0,rates,off:$('#co').checked};
 if(id)Object.assign(S.cards.find(x=>x.id===id),o);else S.cards.push({id:uid(),...o});save();closeSheet();render()}
async function dl(n,t,m){const f=new File([t],n,{type:m});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name=='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;a.click()}
const exportJ=()=>dl(`mymoney-${today()}.json`,JSON.stringify(S),'application/json');
const exportC=()=>dl(`spend-${today()}.csv`,'Date,Card,Category,Amount,Where\n'+S.sp.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,cname(x.card),x.cat,x.amt,'"'+(x.where||'').replace(/"/g,'""')+'"'].join(',')).join('\n'),'text/csv');
function importJ(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.bills||!d.cards)throw 0;if(confirm('Replace all current data with this backup?')){S=d;save();render()}}catch(e){alert('Not a valid backup file')}};r.readAsText(f)}

/* ---------- shell ---------- */
function sheet(h){closeSheet();const d=document.createElement('div');d.id='sh';d.innerHTML=`<div class=bk onclick="closeSheet()"></div><div class=pn>${h}</div>`;document.body.appendChild(d)}
function closeSheet(){const s=$('#sh');if(s)s.remove()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===V.tab));
 if(sb&&!user){$('#app').innerHTML=loginView();return}
 $('#app').innerHTML=V.tab=='bills'?(V.yr?yearView():billsView()):V.tab=='spend'?spendView():setView()}
(async()=>{if(window.supabase&&!SB_URL.startsWith('PASTE')){sb=supabase.createClient(SB_URL,SB_KEY);try{const{data}=await sb.auth.getSession();user=data.session?data.session.user:null}catch(e){}}
 if(!S)S=seed();render();if(user)pull()})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&user&&!$('#sh'))pull()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script></body></html>
